name: Container Build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "20*"
    branches:
      - main
    paths:
      - "**/*.rs"
      - "addon/**"
      - "**/Cargo.*"
      - ".github/workflows/build.yml"
      - ".cargo/config.toml"
      - "scripts/build-cross.sh"
      - "scripts/build-docker.sh"
      - "Dockerfile"
      - ".dockerignore"

env:
  IMAGE: ghcr.io/wez/govee2mqtt

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Docker meta
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=pr
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Install cross from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cross"
      - name: Build executable
        run: ./scripts/build-cross.sh ${{ matrix.platform }}
      - name: Build No Push
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
      - name: Build and push by digest
        if: ${{ github.event_name != 'pull_request' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "DIGEST_NAME=$(echo ${{ matrix.platform }} | sed 's,/,-,g')" >> $GITHUB_OUTPUT
      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.digest.outputs.DIGEST_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=pr
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
  addon:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ${{ matrix.os }}
    needs:
      - merge
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Apply tag to version
        run: ./scripts/apply-tag.sh
      - name: Read add-on version
        id: version
        run: echo "version=$(yq -r .version addon/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build and Publish Home Assistant Add On
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./addon
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ env.IMAGE }}-${{ matrix.arch }}
          image-tags: |
            ${{ steps.version.outputs.version }}
            latest
          version: ${{ steps.version.outputs.version }}
          build-args: |
            GOVEE2MQTT_IMAGE=${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            io.hass.type=addon
            io.hass.name=Govee to MQTT Bridge
            io.hass.description=Control Govee Devices
            io.hass.url=https://github.com/wez/govee2mqtt
          cosign-base-verify: ghcr.io/home-assistant/base-debian:bookworm
          cosign-base-identity: https://github.com/home-assistant/docker-base/.*
          push: "true"

  test-addon:
    if: ${{ ! ( github.event_name == 'push' && github.ref_type == 'tag' ) }}
    runs-on: ${{ matrix.os }}
    # Builds the add-on from the most recently published image, not the one
    # built above: that one is not pushed for pull requests. The add-on build
    # does not run the binary, so this still validates its configuration.
    needs:
      - build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Read add-on version
        id: version
        run: echo "version=$(yq -r .version addon/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Test Build Home Assistant Add On
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./addon
          image: ${{ env.IMAGE }}-${{ matrix.arch }}
          image-tags: test
          version: ${{ steps.version.outputs.version }}
          build-args: |
            GOVEE2MQTT_IMAGE=${{ env.IMAGE }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=Govee to MQTT Bridge
            io.hass.description=Control Govee Devices
            io.hass.url=https://github.com/wez/govee2mqtt
          cosign: "false"
          push: "false"
